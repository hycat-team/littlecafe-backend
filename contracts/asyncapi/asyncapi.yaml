asyncapi: 3.1.0
info:
  title: LittleCafe domain events
  version: 0.1.0
  description: Registry contract-first; bootstrap chưa công bố event nghiệp vụ.
servers:
  production:
    host: rabbitmq:5672
    protocol: amqp
    description: Kết nối nội bộ; credential lấy từ secret runtime.
channels: {}
operations: {}
components:
  schemas:
    EventEnvelope:
      type: object
      required: [messageId, eventType, eventVersion, occurredAt, producer, payload]
      properties:
        messageId: {type: string, format: uuid}
        eventType: {type: string}
        eventVersion: {type: integer, minimum: 1}
        occurredAt: {type: string, format: date-time}
        producer: {type: string}
        traceId: {type: string}
        locale:
          type: string
          enum: [vi, en]
          description: >-
            Locale of the end user that triggered the event. Consumers use it to
            render client-facing notifications; absent means the default `vi`.
        payload: {type: object}

