openapi: 3.0.3
info:
    title: LittleCafe shared API components
    version: 0.1.0
servers:
    - url: https://api.littlecafe.kids/api/v1
paths: {}
components:
    parameters:
        AcceptLanguage:
            name: Accept-Language
            in: header
            required: false
            description: >-
              Negotiates the language of client-facing messages (`title`, `detail`,
              `errors[].message`, success `message`). Missing or unsupported values
              fall back to the default locale `vi`.
            schema:
                type: string
                default: vi
                enum: [vi, en]
        IdempotencyKey:
            name: Idempotency-Key
            in: header
            required: true
            description: >-
              Opaque client-generated key for important mutations. 16-128 characters.
              The same key with a different request payload returns 409. Required for
              order, booking, hold, payment, top-up, refund, withdrawal, and capacity
              mutations.
            schema:
                type: string
                minLength: 16
                maxLength: 128
        LastEventId:
            name: Last-Event-ID
            in: header
            required: false
            description: >-
              Opaque SSE resume cursor. When the id is no longer buffered, the server
              replays the whole buffer.
            schema:
                type: string
    headers:
        Content-Language:
            description: Locale used to render the response.
            schema:
                type: string
                enum: [vi, en]
        X-Trace-ID:
            description: Request trace identifier generated by Nginx.
            schema:
                type: string
        Location:
            description: URI of the created resource or async status resource.
            schema:
                type: string
                format: uri-reference
        RateLimit-Limit:
            description: Request quota for the current window.
            schema:
                type: integer
                minimum: 0
        RateLimit-Remaining:
            description: Requests remaining in the current window.
            schema:
                type: integer
                minimum: 0
        RateLimit-Reset:
            description: Unix epoch seconds when the next token/quota becomes available.
            schema:
                type: integer
                minimum: 0
        Retry-After:
            description: Seconds the client must wait before retrying.
            schema:
                type: integer
                minimum: 0
        Deprecation:
            description: Present with value `true` when the operation is deprecated.
            schema:
                type: string
                enum: ["true"]
        Sunset:
            description: HTTP-date when the deprecated operation will be removed.
            schema:
                type: string
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
        accessTokenCookie:
            type: apiKey
            in: cookie
            name: access_token
        refreshTokenCookie:
            type: apiKey
            in: cookie
            name: refresh_token
    schemas:
        ValidationErrorItem:
            type: object
            required: [field, message]
            properties:
                field:
                    type: string
                    description: >-
                      JSON path of the invalid field, for example
                      `items[0].quantity` or `guardian.email`.
                message:
                    type: string
                    description: Client-facing message localized for the request locale.
        ProblemDetails:
            type: object
            required: [type, title, status]
            properties:
                type:
                    type: string
                    format: uri-reference
                    default: about:blank
                    description: Problem type URI. LittleCafe uses `about:blank`.
                title:
                    type: string
                    description: Short, client-facing error title.
                status:
                    type: integer
                    minimum: 100
                    maximum: 599
                detail:
                    type: string
                    description: Client-facing error detail.
                instance:
                    type: string
                    format: uri-reference
                    description: Request path where the error occurred.
                code:
                    type: string
                    pattern: "^(IDENTITY|ORDER|ACTIVITY|WALLET|AI|NOTIFICATION|REPORTING)_[0-9]{4}$"
                    description: >-
                      Business error code registered in
                      littlecafe-docs/api/error-codes.md. Omitted for generic errors.
                traceId:
                    type: string
                    description: Value of the X-Trace-ID response header.
                errors:
                    type: array
                    items:
                        $ref: "#/components/schemas/ValidationErrorItem"
        SuccessResponse:
            type: object
            required: [message, data]
            properties:
                message:
                    type: string
                    description: Client-facing success message localized for the request locale.
                data:
                    description: >-
                      Response payload. Concrete operations narrow this schema with
                      allOf. May be null when the operation has no data.
        CursorPage:
            type: object
            required: [items, hasMore]
            properties:
                items:
                    type: array
                    description: Page items. Empty pages return [] and never null.
                    items: {}
                nextCursor:
                    type: string
                    description: >-
                      Opaque base64url cursor for the next page. Omitted when
                      hasMore is false.
                hasMore:
                    type: boolean
                    description: Whether another page exists.
        AdminPage:
            type: object
            required: [items, page, limit, totalItems]
            properties:
                items:
                    type: array
                    description: Page items. Empty pages return [] and never null.
                    items: {}
                page:
                    type: integer
                    minimum: 1
                limit:
                    type: integer
                    minimum: 1
                totalItems:
                    type: integer
                    format: int64
                    minimum: 0
    responses:
        BadRequest:
            description: Request validation failed.
            content:
                application/problem+json:
                    schema:
                        $ref: "#/components/schemas/ProblemDetails"
        Unauthorized:
            description: Authentication is missing or invalid.
            content:
                application/problem+json:
                    schema:
                        $ref: "#/components/schemas/ProblemDetails"
        Forbidden:
            description: Authenticated but not allowed to perform the action.
            content:
                application/problem+json:
                    schema:
                        $ref: "#/components/schemas/ProblemDetails"
        NotFound:
            description: Resource was not found.
            content:
                application/problem+json:
                    schema:
                        $ref: "#/components/schemas/ProblemDetails"
        Conflict:
            description: State or idempotency conflict.
            content:
                application/problem+json:
                    schema:
                        $ref: "#/components/schemas/ProblemDetails"
        TooManyRequests:
            description: Rate limit exceeded.
            headers:
                Retry-After:
                    $ref: "#/components/headers/Retry-After"
                RateLimit-Limit:
                    $ref: "#/components/headers/RateLimit-Limit"
                RateLimit-Remaining:
                    $ref: "#/components/headers/RateLimit-Remaining"
                RateLimit-Reset:
                    $ref: "#/components/headers/RateLimit-Reset"
            content:
                application/problem+json:
                    schema:
                        $ref: "#/components/schemas/ProblemDetails"
        InternalError:
            description: Unexpected server error.
            content:
                application/problem+json:
                    schema:
                        $ref: "#/components/schemas/ProblemDetails"
        ServiceUnavailable:
            description: A required dependency is unavailable.
            content:
                application/problem+json:
                    schema:
                        $ref: "#/components/schemas/ProblemDetails"
