name: CD Staging

on:
    workflow_dispatch:
        inputs:
            services:
                description: "Services to deploy (comma-separated, or all)"
                required: true
                default: all
                type: string
    push:
        branches:
            - develop
        paths-ignore:
            - "docs/**"
            - "**/*.md"
            - ".github/**"

permissions:
    contents: read
    packages: write

concurrency:
    group: littlecafe-vps-staging
    cancel-in-progress: false

env:
    IMAGE_OWNER: ${{ github.repository_owner }}
    IMAGE_PREFIX: ghcr.io/hycat-team/littlecafe-backend

jobs:
    plan:
        name: Resolve deployment plan
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.plan.outputs.matrix }}
        steps:
            - name: Resolve and validate services
              id: plan
              shell: bash
              env:
                  REQUESTED_SERVICES: ${{ inputs.services }}
              run: |
                set -euo pipefail
                if [[ -z "${REQUESTED_SERVICES}" || "${REQUESTED_SERVICES}" == "all" ]]; then
                  services=(commerce experience ai platform)
                else
                  IFS=',' read -ra services <<< "${REQUESTED_SERVICES// /}"
                fi

                allowed=(commerce experience ai platform)
                for service in "${services[@]}"; do
                  if [[ ! " ${allowed[*]} " == *" ${service} "* ]]; then
                    echo "Unsupported service: ${service}" >&2
                    exit 1
                  fi
                done

                printf 'matrix=%s\n' "$(printf '%s\n' "${services[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "${GITHUB_OUTPUT}"

    build-push:
        name: Build and push ${{ matrix.service }}
        needs: plan
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                service: ${{ fromJSON(needs.plan.outputs.matrix) }}
        steps:
            - uses: actions/checkout@v5
            - uses: docker/setup-buildx-action@v4
            - uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Build and push immutable staging image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: services/${{ matrix.service }}/Dockerfile
                  platforms: linux/amd64
                  push: true
                  tags: |
                    ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:staging-${{ github.sha }}
                    ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:staging-latest
                  cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:staging-buildcache
                  cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:staging-buildcache,mode=max

    deploy:
        name: Deploy selected staging services
        needs: [plan, build-push]
        runs-on: ubuntu-latest
        timeout-minutes: 30
        environment: staging
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: "24"
            - uses: actions/cache@v6
              with:
                  path: ~/.npm
                  key: npm-${{ runner.os }}-${{ hashFiles('Makefile') }}
                  restore-keys: |
                      npm-${{ runner.os }}-
            - name: Build staging API docs
              shell: bash
              run: |
                set -euo pipefail
                grep -q 'https://api.littlecafe.kids/api/v1' contracts/openapi/components.yaml
                sed 's#https://api.littlecafe.kids/api/v1#https://staging-api.littlecafe.kids:8443/api/v1#' \
                  contracts/openapi/components.yaml > /tmp/components.staging.yaml
                make docs-build DOCS_SPEC=/tmp/components.staging.yaml \
                  DOCS_TITLE="LittleCafe API (staging)" DOCS_OUT=docs-site
            - uses: docker/setup-buildx-action@v4
            - uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Prepare SSH
              shell: bash
              run: |
                install -m 700 -d ~/.ssh
                printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
                chmod 600 ~/.ssh/id_ed25519
                printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
                chmod 600 ~/.ssh/known_hosts
            - name: Upload deployment files
              shell: bash
              run: |
                tar -czf /tmp/littlecafe-staging-deploy.tar.gz \
                  docs-site \
                  deployments/docker-compose.staging.yml \
                  deployments/env/staging.env.enc \
                  deployments/nginx/staging.conf \
                  deployments/scripts/apply-env.sh \
                  deployments/scripts/deploy-release.sh \
                  deployments/scripts/init-db.sh \
                  deployments/scripts/issue-certs.sh \
                  deployments/scripts/render-docs-auth.sh \
                  deployments/scripts/render-env.sh \
                  deployments/scripts/renew-certs.sh \
                  deployments/scripts/sops-run.sh \
                  .env.staging.example
                scp -P "${{ secrets.DEPLOY_PORT }}" /tmp/littlecafe-staging-deploy.tar.gz \
                  "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/littlecafe-staging-deploy.tar.gz"
            - name: Install deployment files
              shell: bash
              run: |
                ssh -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
                  "set -e; mkdir -p /opt/littlecafe-staging; \
                   tar -xzf /tmp/littlecafe-staging-deploy.tar.gz -C /opt/littlecafe-staging; \
                   rm -f /tmp/littlecafe-staging-deploy.tar.gz"
            - name: Login VPS to private GHCR
              shell: bash
              run: |
                printf '%s' "${{ secrets.GHCR_READ_TOKEN }}" | \
                  ssh -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
                  "docker login ghcr.io -u '${{ secrets.GHCR_USERNAME }}' --password-stdin"
            - name: Apply staging env from SOPS
              shell: bash
              run: |
                ssh -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
                  "cd /opt/littlecafe-staging && \
                   SOPS_AGE_KEY_FILE=/opt/littlecafe-staging-secrets/age/keys.txt \
                   sh deployments/scripts/apply-env.sh \
                     deployments/env/staging.env.enc .env.staging .env.staging.example"
            - name: Render staging docs basic auth
              shell: bash
              run: |
                ssh -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
                  "cd /opt/littlecafe-staging && sh deployments/scripts/render-docs-auth.sh .env.staging docs-auth/docs.htpasswd"
            - name: Ensure staging deploy env keys
              shell: bash
              run: |
                ssh -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
                  "set -e
                   cd /opt/littlecafe-staging
                   touch .env.staging.deploy
                   for S in COMMERCE EXPERIENCE AI PLATFORM; do
                     if ! grep -q \"^\${S}_IMAGE=\" .env.staging.deploy; then
                       lower=\$(printf %s \"\${S}\" | tr '[:upper:]' '[:lower:]')
                       printf '%s_IMAGE=ghcr.io/hycat-team/littlecafe-backend-%s:staging-latest\\n' \"\${S}\" \"\${lower}\" >> .env.staging.deploy
                     fi
                   done
                   chmod 600 .env.staging.deploy"
            - name: Deploy pinned staging images and migrations
              shell: bash
              env:
                  SERVICES_JSON: ${{ needs.plan.outputs.matrix }}
                  IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
                  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
                  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
                  DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
              run: |
                set -euo pipefail
                args=()
                for service in $(printf '%s' "${SERVICES_JSON}" | jq -r '.[]'); do
                  image="${IMAGE_PREFIX}-${service}"
                  digest=$(docker buildx imagetools inspect "${image}:staging-${GITHUB_SHA}" --format '{{.Manifest.Digest}}')
                  ref="${image}@${digest}"
                  args+=("${service}=${ref}")
                done
                printf -v quoted '%q ' "${args[@]}"
                ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
                  -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
                  "cd /opt/littlecafe-staging && bash deployments/scripts/deploy-release.sh \
                   deployments/docker-compose.staging.yml .env.staging .env.staging.deploy ${quoted}"

    smoke-services:
        name: Smoke staging container ${{ matrix.service }}
        needs: deploy
        runs-on: ubuntu-latest
        environment: staging
        strategy:
            fail-fast: false
            matrix:
                service: [commerce, experience, ai, platform]
        steps:
            - name: Prepare SSH
              shell: bash
              run: |
                install -m 700 -d ~/.ssh
                printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
                chmod 600 ~/.ssh/id_ed25519
                printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
                chmod 600 ~/.ssh/known_hosts
            - name: Wait for service healthcheck
              shell: bash
              run: |
                for _ in $(seq 1 12); do
                  status=$(ssh -p "${{ secrets.DEPLOY_PORT }}" \
                    "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
                    "cd /opt/littlecafe-staging && id=\$(docker compose --env-file .env.staging --env-file .env.staging.deploy -f deployments/docker-compose.staging.yml ps -q ${{ matrix.service }}); \
                     test -n \"\$id\"; \
                     docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \"\$id\"" || true)
                  if [[ "${status}" == "healthy" || "${status}" == "running" ]]; then
                    exit 0
                  fi
                  sleep 5
                done
                echo "Smoke test failed for ${{ matrix.service }}"
                exit 1

    smoke-public:
        name: Smoke staging API from VPS
        needs: deploy
        runs-on: ubuntu-latest
        environment: staging
        steps:
            - name: Prepare SSH
              shell: bash
              run: |
                install -m 700 -d ~/.ssh
                printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
                chmod 600 ~/.ssh/id_ed25519
                printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
                chmod 600 ~/.ssh/known_hosts
            - name: Check health endpoint through the staging nginx
              shell: bash
              run: |
                for _ in $(seq 1 12); do
                  if ssh -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
                    "curl --fail --silent --show-error --max-time 15 \
                     --resolve staging-api.littlecafe.kids:8443:127.0.0.1 \
                     https://staging-api.littlecafe.kids:8443/api/v1/health" >/dev/null; then
                    exit 0
                  fi
                  sleep 5
                done
                echo "Staging health check through nginx failed"
                exit 1
