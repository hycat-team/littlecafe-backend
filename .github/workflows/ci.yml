name: CI

on:
    pull_request:
        branches: [main, develop]
        paths-ignore:
            - "docs/**"
            - "**/*.md"
    push:
        branches: [develop]
        paths-ignore:
            - "docs/**"
            - "**/*.md"

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    GO_VERSION: "1.26.x"

jobs:
    static:
        name: Static checks
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/setup-go-cached
              with:
                  go-version: ${{ env.GO_VERSION }}
            - name: Check formatting
              run: make fmt-check
            - name: Check module tidy state
              run: make tidy-check
            - name: Check generated sources
              run: make generate
            - name: Verify generated sources are committed
              shell: bash
              run: |
                  if ! git diff --exit-code -- contracts/ services/*/internal/di; then
                    echo "::error::Generated sources are stale. Run 'make generate' and commit the result."
                    exit 1
                  fi
            - name: Verify workspace sums are committed
              shell: bash
              run: |
                  if ! git diff --exit-code -- go.work.sum; then
                    echo "::error::go.work.sum is stale after a dependency change. Run 'make generate' and commit go.work.sum."
                    exit 1
                  fi
            - name: Check SOPS env key parity
              run: make env-check
            - name: Validate deployment scripts
              run: bash -n deployments/scripts/deploy-release.sh
            - name: Lint GitHub workflows
              run: |
                  go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
                  "$(go env GOPATH)/bin/actionlint"

    test:
        name: Unit tests, coverage and vet
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/setup-go-cached
              with:
                  go-version: ${{ env.GO_VERSION }}
            - name: Enforce business statement coverage
              run: make coverage-check TEST_FLAGS=-short
            - name: Go vet
              run: make vet
            - name: Check dependency boundaries
              run: sh deployments/scripts/check-boundaries.sh

    test-race:
        name: Race detector
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/setup-go-cached
              with:
                  go-version: ${{ env.GO_VERSION }}
            - run: make test-race TEST_FLAGS=-short

    infra:
        name: Compose and SOPS checks
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - name: Install sops and age
              shell: bash
              run: |
                  sudo curl -fsSL -o /usr/local/bin/sops \
                    https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
                  sudo chmod +x /usr/local/bin/sops
                  curl -fsSL \
                    https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz \
                    | tar -xz -C /tmp
                  sudo install -m 755 /tmp/age/age-keygen /usr/local/bin/age-keygen
                  sops --version
                  command -v age-keygen
            - name: Round-trip apply-env test
              run: make env-sops-test SOPS_MODE=binary
            - name: Prepare example environments
              shell: bash
              run: |
                  cp .env.example .env
                  cp .env.production.example .env.production
                  cp .env.staging.example .env.staging
                  for service in commerce experience ai platform; do
                    upper=$(printf '%s' "${service}" | tr '[:lower:]' '[:upper:]')
                    printf '%s_IMAGE=ghcr.io/hycat-team/littlecafe-backend-%s:ci\n' "${upper}" "${service}" >> .env.deploy
                    printf '%s_IMAGE=ghcr.io/hycat-team/littlecafe-backend-%s:staging-ci\n' "${upper}" "${service}" >> .env.staging.deploy
                  done
            - name: Validate local Compose
              run: docker compose -f deployments/docker-compose.yml --env-file .env --profile full config --quiet
            - name: Validate production Compose
              run: docker compose -f deployments/docker-compose.prod.yml --env-file .env.production --env-file .env.deploy config --quiet
            - name: Validate staging Compose
              run: docker compose -f deployments/docker-compose.staging.yml --env-file .env.staging --env-file .env.staging.deploy config --quiet
