# Lint and breaking checks for inter-service protobuf contracts.
version: v1
lint:
  use:
    - STANDARD
  except:
    # Proto packages are domain names (littlecafe_backend.<owner>.v1); the
    # directory layout follows the Go module convention (contracts/<owner>/v1)
    # instead.
    - PACKAGE_DIRECTORY_MATCH
    # Internal inter-service contracts intentionally share DTO-shaped messages
    # across RPCs; per-RPC Google-API-style names would only add boilerplate.
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
