# Identity service overlay. Merged on top of configs/base.yaml.
# Add only sections owned by this service.

google:
  web_client_id: ${GOOGLE_WEB_CLIENT_ID:-}
  web_client_secret: ${GOOGLE_WEB_CLIENT_SECRET:-}
  redirect_uri: ${GOOGLE_OAUTH_CALLBACK_URL:-https://api.littlecafe.kids/api/v1/identity/oauth/google/callback}
  state_ttl_minutes: 10

# ES256 signing is owned by Identity; every other service only loads the
# shared jwt.public_key_file.
signing:
  private_key_file: ${JWT_PRIVATE_KEY:-}
