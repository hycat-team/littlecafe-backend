app:
  mode: ${APP_MODE:-all}
  env: ${SERVER_ENV:-development}

server:
  port: ${SERVER_PORT:-8080}
  grpc_port: ${GRPC_PORT:-9090}
  sse:
    heartbeat_seconds: ${SSE_HEARTBEAT_SECONDS:-15}
    replay_buffer_size: ${SSE_REPLAY_BUFFER_SIZE:-100}
    replay_buffer_ttl_seconds: ${SSE_REPLAY_BUFFER_TTL_SECONDS:-300}

database:
  host: ${DB_HOST:-localhost}
  port: ${DB_PORT:-5432}
  user: ${DB_USER:-littlecafe_admin}
  password: ${DB_PASSWORD:-123456}
  name: ${DB_NAME:-littlecafe_identity}
  sslmode: ${DB_SSLMODE:-disable}
  timezone: ${DB_TIMEZONE:-Asia/Ho_Chi_Minh}
  migrate_on_start: ${DB_MIGRATE_ON_START:-false}
jwt:
  algorithm: ${JWT_ALGORITHM:-ES256}
  private_key_file: ${JWT_PRIVATE_KEY:-}
  public_key_file: ${JWT_PUBLIC_KEY:-}

logger:
  log_level: ${LOG_LEVEL:-debug}
  log_to_file: false
  file_path: ${LOG_FILE_PATH:-logs/app.log}

startup:
  retry_attempt_1_seconds: ${STARTUP_RETRY_1_SECONDS:-2}
  retry_attempt_2_seconds: ${STARTUP_RETRY_2_SECONDS:-5}
  retry_attempt_3_seconds: ${STARTUP_RETRY_3_SECONDS:-10}

redis:
  host: ${REDIS_HOST:-localhost}
  port: ${REDIS_PORT:-6379}
  password: ${REDIS_PASSWORD:-}
  db: ${REDIS_DB:-0}
  tls_enabled: ${REDIS_TLS_ENABLED:-false}

rate_limit:
  token_limit: ${RATE_LIMIT_TOKEN_LIMIT:-60}
  tokens_per_period: ${RATE_LIMIT_TOKENS_PER_PERIOD:-60}
  replenishment_seconds: ${RATE_LIMIT_REPLENISHMENT_SECONDS:-60}

rabbitmq:
  host: ${RABBITMQ_HOST:-localhost}
  port: ${RABBITMQ_PORT:-5672}
  management_port: ${RABBITMQ_MANAGEMENT_PORT:-15672}
  user: ${RABBITMQ_USER:-admin}
  password: ${RABBITMQ_PASSWORD:-123456}
  vhost: ${RABBITMQ_VHOST:-/}
  prefetch: ${RABBITMQ_PREFETCH:-20}
  tls_enabled: ${RABBITMQ_TLS_ENABLED:-false}
  management_tls_enabled: ${RABBITMQ_MANAGEMENT_TLS_ENABLED:-false}

outbox:
  retry_max_attempts: ${OUTBOX_RETRY_MAX_ATTEMPTS:-10}
  retry_interval_minutes: ${OUTBOX_RETRY_INTERVAL_MINUTES:-1}
  cleanup_retention_days: ${OUTBOX_CLEANUP_RETENTION_DAYS:-7}
  cleanup_interval_minutes: ${OUTBOX_CLEANUP_INTERVAL_MINUTES:-60}
  batch_size: ${OUTBOX_BATCH_SIZE:-100}
  listener_enabled: ${OUTBOX_LISTENER_ENABLED:-true}

cloudinary:
  cloud_name: ${CLOUDINARY_CLOUD_NAME:-}
  api_key: ${CLOUDINARY_API_KEY:-}
  api_secret: ${CLOUDINARY_API_SECRET:-}
  api_url: ${CLOUDINARY_API_URL:-https://api.cloudinary.com}
  folder: ${CLOUDINARY_FOLDER:-littlecafe_backend}

admin:
  audit_retention_months: ${ADMIN_AUDIT_RETENTION_MONTHS:-24}
