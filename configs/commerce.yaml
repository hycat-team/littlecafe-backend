# Commerce service overlay. Merged on top of configs/base.yaml.
# Owns Identity (Google OAuth, ES256 signing) and Wallet (payOS) settings.

google:
    web_client_id: ${GOOGLE_WEB_CLIENT_ID:-}
    web_client_secret: ${GOOGLE_WEB_CLIENT_SECRET:-}
    redirect_uri: ${GOOGLE_OAUTH_CALLBACK_URL:-https://api.littlecafe.kids/api/v1/identity/oauth/google/callback}
    state_ttl_minutes: 10

# ES256 signing is owned by Commerce (Identity module); every other service
# only loads the shared jwt.public_key_file.
signing:
    private_key_file: ${JWT_PRIVATE_KEY:-}

payment:
    provider: payos
    client_id: ${PAYOS_CLIENT_ID:-}
    api_key: ${PAYOS_API_KEY:-}
    checksum_key: ${PAYOS_CHECKSUM_KEY:-}
    return_url: ${PAYOS_RETURN_URL:-https://littlecafe.kids/payment/success}
    cancel_url: ${PAYOS_CANCEL_URL:-https://littlecafe.kids/payment/cancel}
    webhook_url: ${PAYOS_WEBHOOK_URL:-https://api.littlecafe.kids/api/v1/wallet/webhooks/payos}
    payout_enabled: ${PAYOUT_ENABLED:-false}
    expired_minutes: 15
    reconciliation_cron: "0 */5 * * * *"
