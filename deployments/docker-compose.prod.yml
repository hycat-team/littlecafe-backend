name: littlecafe-prod

x-logging: &logging
    driver: json-file
    options:
        max-size: "10m"
        max-file: "3"

x-security: &security
    - no-new-privileges:true

x-runtime: &runtime
    restart: unless-stopped
    # Run as the VPS deploy user so deploy-owned secrets (700 dirs, 600 keys)
    # are readable without making them world-readable.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    env_file: ../.env.production
    environment: &runtime-env
        CONFIG_BASE: configs/base.yaml
        DB_HOST: postgres
        DB_MIGRATE_ON_START: "false"
        REDIS_HOST: redis
        RABBITMQ_HOST: rabbitmq
        JWT_PUBLIC_KEY: /run/littlecafe/jwt/jwt-public.pem
        JWT_PRIVATE_KEY: ""
        TZ: Asia/Ho_Chi_Minh
    depends_on:
        postgres: {condition: service_healthy}
    mem_limit: 128m
    stop_grace_period: 30s
    security_opt: *security
    logging: *logging

services:
    postgres:
        image: pgvector/pgvector:pg17
        restart: unless-stopped
        mem_limit: 512m
        shm_size: 128m
        env_file: ../.env.production
        environment:
            POSTGRES_USER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER is required}
            POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
            POSTGRES_DB: postgres
            TZ: Asia/Ho_Chi_Minh
        volumes:
            - postgres-data:/var/lib/postgresql/data
        ports:
            - "127.0.0.1:5433:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d postgres"]
            interval: 10s
            timeout: 5s
            retries: 20
        security_opt: *security
        logging: *logging

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        mem_limit: 96m
        env_file: ../.env.production
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
            TZ: Asia/Ho_Chi_Minh
        command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
        healthcheck:
            test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
            interval: 10s
            timeout: 5s
            retries: 20
        security_opt: *security
        logging: *logging

    rabbitmq:
        image: rabbitmq:3-management-alpine
        restart: unless-stopped
        mem_limit: 384m
        env_file: ../.env.production
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
            TZ: Asia/Ho_Chi_Minh
        volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 15s
            timeout: 10s
            retries: 20
        security_opt: *security
        logging: *logging

    db-init:
        image: pgvector/pgvector:pg17
        profiles: ["init"]
        restart: "no"
        mem_limit: 64m
        env_file: ../.env.production
        environment:
            PGHOST: postgres
            PGPORT: "5432"
            PGUSER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER is required}
            PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
            PGDATABASE: postgres
            TZ: Asia/Ho_Chi_Minh
        volumes:
            - ./scripts/init-db.sh:/init-db.sh:ro
        entrypoint: ["/bin/sh", "/init-db.sh"]
        depends_on:
            postgres: {condition: service_healthy}
        security_opt: *security
        logging: *logging

    migrate-commerce:
        image: ${COMMERCE_IMAGE:?COMMERCE_IMAGE is required}
        profiles: ["migrate"]
        restart: "no"
        mem_limit: 128m
        env_file: ../.env.production
        command: ["-migrate-only"]
        environment:
            <<: *runtime-env
            DB_USER: littlecafe_commerce
            DB_PASSWORD: ${COMMERCE_DB_PASSWORD:?COMMERCE_DB_PASSWORD is required}
            DB_NAME: littlecafe_commerce
            DB_MIGRATE_ON_START: "true"
            JWT_PRIVATE_KEY: /run/littlecafe/jwt/jwt-private.pem
        volumes:
            - ${JWT_DIR:-/opt/littlecafe-secrets/jwt}:/run/littlecafe/jwt:ro
        depends_on:
            postgres: {condition: service_healthy}
        security_opt: *security
        logging: *logging

    commerce:
        <<: *runtime
        image: ${COMMERCE_IMAGE:?COMMERCE_IMAGE is required}
        environment:
            <<: *runtime-env
            DB_USER: littlecafe_commerce
            DB_PASSWORD: ${COMMERCE_DB_PASSWORD:?COMMERCE_DB_PASSWORD is required}
            DB_NAME: littlecafe_commerce
            GRPC_TLS_CA_FILE: /run/littlecafe/certs/ca.crt
            GRPC_TLS_CERT_FILE: /run/littlecafe/certs/commerce.crt
            GRPC_TLS_KEY_FILE: /run/littlecafe/certs/commerce.key
            JWT_PRIVATE_KEY: /run/littlecafe/jwt/jwt-private.pem
        volumes:
            - ${CERTS_DIR:-/opt/littlecafe-secrets/certs}:/run/littlecafe/certs:ro
            - ${JWT_DIR:-/opt/littlecafe-secrets/jwt}:/run/littlecafe/jwt:ro

    migrate-experience:
        image: ${EXPERIENCE_IMAGE:?EXPERIENCE_IMAGE is required}
        profiles: ["migrate"]
        restart: "no"
        mem_limit: 128m
        env_file: ../.env.production
        command: ["-migrate-only"]
        environment:
            <<: *runtime-env
            DB_USER: littlecafe_experience
            DB_PASSWORD: ${EXPERIENCE_DB_PASSWORD:?EXPERIENCE_DB_PASSWORD is required}
            DB_NAME: littlecafe_experience
            DB_MIGRATE_ON_START: "true"
        volumes:
            - ${JWT_DIR:-/opt/littlecafe-secrets/jwt}/jwt-public.pem:/run/littlecafe/jwt/jwt-public.pem:ro
        depends_on:
            postgres: {condition: service_healthy}
        security_opt: *security
        logging: *logging

    experience:
        <<: *runtime
        image: ${EXPERIENCE_IMAGE:?EXPERIENCE_IMAGE is required}
        environment:
            <<: *runtime-env
            DB_USER: littlecafe_experience
            DB_PASSWORD: ${EXPERIENCE_DB_PASSWORD:?EXPERIENCE_DB_PASSWORD is required}
            DB_NAME: littlecafe_experience
            GRPC_TLS_CA_FILE: /run/littlecafe/certs/ca.crt
            GRPC_TLS_CERT_FILE: /run/littlecafe/certs/experience.crt
            GRPC_TLS_KEY_FILE: /run/littlecafe/certs/experience.key
        volumes:
            - ${CERTS_DIR:-/opt/littlecafe-secrets/certs}:/run/littlecafe/certs:ro
            - ${JWT_DIR:-/opt/littlecafe-secrets/jwt}/jwt-public.pem:/run/littlecafe/jwt/jwt-public.pem:ro

    migrate-ai:
        image: ${AI_IMAGE:?AI_IMAGE is required}
        profiles: ["migrate"]
        restart: "no"
        mem_limit: 128m
        env_file: ../.env.production
        command: ["-migrate-only"]
        environment:
            <<: *runtime-env
            DB_USER: littlecafe_ai
            DB_PASSWORD: ${AI_DB_PASSWORD:?AI_DB_PASSWORD is required}
            DB_NAME: littlecafe_ai
            DB_MIGRATE_ON_START: "true"
        volumes:
            - ${JWT_DIR:-/opt/littlecafe-secrets/jwt}/jwt-public.pem:/run/littlecafe/jwt/jwt-public.pem:ro
        depends_on:
            postgres: {condition: service_healthy}
        security_opt: *security
        logging: *logging

    ai:
        <<: *runtime
        image: ${AI_IMAGE:?AI_IMAGE is required}
        environment:
            <<: *runtime-env
            DB_USER: littlecafe_ai
            DB_PASSWORD: ${AI_DB_PASSWORD:?AI_DB_PASSWORD is required}
            DB_NAME: littlecafe_ai
            GRPC_TLS_CA_FILE: /run/littlecafe/certs/ca.crt
            GRPC_TLS_CERT_FILE: /run/littlecafe/certs/ai.crt
            GRPC_TLS_KEY_FILE: /run/littlecafe/certs/ai.key
        volumes:
            - ${CERTS_DIR:-/opt/littlecafe-secrets/certs}:/run/littlecafe/certs:ro
            - ${JWT_DIR:-/opt/littlecafe-secrets/jwt}/jwt-public.pem:/run/littlecafe/jwt/jwt-public.pem:ro

    migrate-platform:
        image: ${PLATFORM_IMAGE:?PLATFORM_IMAGE is required}
        profiles: ["migrate"]
        restart: "no"
        mem_limit: 128m
        env_file: ../.env.production
        command: ["-migrate-only"]
        environment:
            <<: *runtime-env
            DB_USER: littlecafe_platform
            DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?PLATFORM_DB_PASSWORD is required}
            DB_NAME: littlecafe_platform
            DB_MIGRATE_ON_START: "true"
        volumes:
            - ${JWT_DIR:-/opt/littlecafe-secrets/jwt}/jwt-public.pem:/run/littlecafe/jwt/jwt-public.pem:ro
        depends_on:
            postgres: {condition: service_healthy}
        security_opt: *security
        logging: *logging

    platform:
        <<: *runtime
        image: ${PLATFORM_IMAGE:?PLATFORM_IMAGE is required}
        environment:
            <<: *runtime-env
            DB_USER: littlecafe_platform
            DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?PLATFORM_DB_PASSWORD is required}
            DB_NAME: littlecafe_platform
            GRPC_TLS_CA_FILE: /run/littlecafe/certs/ca.crt
            GRPC_TLS_CERT_FILE: /run/littlecafe/certs/platform.crt
            GRPC_TLS_KEY_FILE: /run/littlecafe/certs/platform.key
        volumes:
            - ${CERTS_DIR:-/opt/littlecafe-secrets/certs}:/run/littlecafe/certs:ro
            - ${JWT_DIR:-/opt/littlecafe-secrets/jwt}/jwt-public.pem:/run/littlecafe/jwt/jwt-public.pem:ro

    nginx:
        image: nginx:alpine
        restart: unless-stopped
        mem_limit: 48m
        environment:
            API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required}
            HTTPS_PORT: ${HTTPS_PORT:-443}
            NGINX_ENVSUBST_FILTER: ^(API_DOMAIN|HTTPS_PORT)
            TZ: Asia/Ho_Chi_Minh
        ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
        volumes:
            - ./nginx/prod.conf:/etc/nginx/templates/default.conf.template:ro
            - ${TLS_DIR:-/opt/littlecafe-tls}:/etc/nginx/tls:ro
        security_opt: *security
        logging: *logging

volumes:
    postgres-data:
    rabbitmq-data:
