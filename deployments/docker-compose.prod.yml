name: littlecafe-prod

x-runtime: &runtime
  restart: unless-stopped
  env_file: ../.env.production
  environment: &runtime-env
    CONFIG_BASE: configs/base.yaml
    SERVER_PORT: "8080"
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_SSLMODE: disable
    DB_TIMEZONE: Asia/Ho_Chi_Minh
    DB_MIGRATE_ON_START: "false"
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_PORT: "5672"
    TZ: ${TZ:-Asia/Ho_Chi_Minh}
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    rabbitmq: {condition: service_healthy}

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    env_file: ../.env.production
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      POSTGRES_DB: postgres
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: ../.env.production
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    env_file: ../.env.production
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 20

  migrate-identity:
    image: ${IDENTITY_IMAGE:?IDENTITY_IMAGE is required}
    profiles: ["migrate"]
    env_file: ../.env.production
    command: ["/app/app", "-migrate-only"]
    environment:
      <<: *runtime-env
      DB_USER: littlecafe_identity
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD is required}
      DB_NAME: littlecafe_identity
      DB_MIGRATE_ON_START: "true"
    depends_on:
      postgres: {condition: service_healthy}

  identity:
    <<: *runtime
    image: ${IDENTITY_IMAGE:?IDENTITY_IMAGE is required}
    environment:
      <<: *runtime-env
      DB_USER: littlecafe_identity
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD is required}
      DB_NAME: littlecafe_identity
      GRPC_PORT: "9090"
      GRPC_TLS_CA_FILE: /run/littlecafe/certs/ca.crt
      GRPC_TLS_CERT_FILE: /run/littlecafe/certs/identity.crt
      GRPC_TLS_KEY_FILE: /run/littlecafe/certs/identity.key
    volumes:
      - ${CERTS_DIR:-/opt/littlecafe/secrets/certs}:/run/littlecafe/certs:ro

  migrate-order:
    image: ${ORDER_IMAGE:?ORDER_IMAGE is required}
    profiles: ["migrate"]
    env_file: ../.env.production
    command: ["/app/app", "-migrate-only"]
    environment:
      <<: *runtime-env
      DB_USER: littlecafe_order
      DB_PASSWORD: ${ORDER_DB_PASSWORD:?ORDER_DB_PASSWORD is required}
      DB_NAME: littlecafe_order
      DB_MIGRATE_ON_START: "true"
    depends_on:
      postgres: {condition: service_healthy}

  order:
    <<: *runtime
    image: ${ORDER_IMAGE:?ORDER_IMAGE is required}
    environment:
      <<: *runtime-env
      DB_USER: littlecafe_order
      DB_PASSWORD: ${ORDER_DB_PASSWORD:?ORDER_DB_PASSWORD is required}
      DB_NAME: littlecafe_order
      GRPC_PORT: "9090"
      GRPC_TLS_CA_FILE: /run/littlecafe/certs/ca.crt
      GRPC_TLS_CERT_FILE: /run/littlecafe/certs/order.crt
      GRPC_TLS_KEY_FILE: /run/littlecafe/certs/order.key
    volumes:
      - ${CERTS_DIR:-/opt/littlecafe/secrets/certs}:/run/littlecafe/certs:ro

  migrate-activity:
    image: ${ACTIVITY_IMAGE:?ACTIVITY_IMAGE is required}
    profiles: ["migrate"]
    env_file: ../.env.production
    command: ["/app/app", "-migrate-only"]
    environment:
      <<: *runtime-env
      DB_USER: littlecafe_activity
      DB_PASSWORD: ${ACTIVITY_DB_PASSWORD:?ACTIVITY_DB_PASSWORD is required}
      DB_NAME: littlecafe_activity
      DB_MIGRATE_ON_START: "true"
    depends_on:
      postgres: {condition: service_healthy}

  activity:
    <<: *runtime
    image: ${ACTIVITY_IMAGE:?ACTIVITY_IMAGE is required}
    environment:
      <<: *runtime-env
      DB_USER: littlecafe_activity
      DB_PASSWORD: ${ACTIVITY_DB_PASSWORD:?ACTIVITY_DB_PASSWORD is required}
      DB_NAME: littlecafe_activity
      GRPC_PORT: "9090"
      GRPC_TLS_CA_FILE: /run/littlecafe/certs/ca.crt
      GRPC_TLS_CERT_FILE: /run/littlecafe/certs/activity.crt
      GRPC_TLS_KEY_FILE: /run/littlecafe/certs/activity.key
    volumes:
      - ${CERTS_DIR:-/opt/littlecafe/secrets/certs}:/run/littlecafe/certs:ro

  migrate-wallet:
    image: ${WALLET_IMAGE:?WALLET_IMAGE is required}
    profiles: ["migrate"]
    env_file: ../.env.production
    command: ["/app/app", "-migrate-only"]
    environment:
      <<: *runtime-env
      DB_USER: littlecafe_wallet
      DB_PASSWORD: ${WALLET_DB_PASSWORD:?WALLET_DB_PASSWORD is required}
      DB_NAME: littlecafe_wallet
      DB_MIGRATE_ON_START: "true"
    depends_on:
      postgres: {condition: service_healthy}

  wallet:
    <<: *runtime
    image: ${WALLET_IMAGE:?WALLET_IMAGE is required}
    environment:
      <<: *runtime-env
      DB_USER: littlecafe_wallet
      DB_PASSWORD: ${WALLET_DB_PASSWORD:?WALLET_DB_PASSWORD is required}
      DB_NAME: littlecafe_wallet
      GRPC_PORT: "9090"
      GRPC_TLS_CA_FILE: /run/littlecafe/certs/ca.crt
      GRPC_TLS_CERT_FILE: /run/littlecafe/certs/wallet.crt
      GRPC_TLS_KEY_FILE: /run/littlecafe/certs/wallet.key
    volumes:
      - ${CERTS_DIR:-/opt/littlecafe/secrets/certs}:/run/littlecafe/certs:ro

  migrate-ai:
    image: ${AI_IMAGE:?AI_IMAGE is required}
    profiles: ["migrate"]
    env_file: ../.env.production
    command: ["/app/app", "-migrate-only"]
    environment:
      <<: *runtime-env
      DB_USER: littlecafe_ai
      DB_PASSWORD: ${AI_DB_PASSWORD:?AI_DB_PASSWORD is required}
      DB_NAME: littlecafe_ai
      DB_MIGRATE_ON_START: "true"
    depends_on:
      postgres: {condition: service_healthy}

  ai:
    <<: *runtime
    image: ${AI_IMAGE:?AI_IMAGE is required}
    environment:
      <<: *runtime-env
      DB_USER: littlecafe_ai
      DB_PASSWORD: ${AI_DB_PASSWORD:?AI_DB_PASSWORD is required}
      DB_NAME: littlecafe_ai

  migrate-notification:
    image: ${NOTIFICATION_IMAGE:?NOTIFICATION_IMAGE is required}
    profiles: ["migrate"]
    env_file: ../.env.production
    command: ["/app/app", "-migrate-only"]
    environment:
      <<: *runtime-env
      DB_USER: littlecafe_notification
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?NOTIFICATION_DB_PASSWORD is required}
      DB_NAME: littlecafe_notification
      DB_MIGRATE_ON_START: "true"
    depends_on:
      postgres: {condition: service_healthy}

  notification:
    <<: *runtime
    image: ${NOTIFICATION_IMAGE:?NOTIFICATION_IMAGE is required}
    environment:
      <<: *runtime-env
      DB_USER: littlecafe_notification
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?NOTIFICATION_DB_PASSWORD is required}
      DB_NAME: littlecafe_notification

  migrate-reporting:
    image: ${REPORTING_IMAGE:?REPORTING_IMAGE is required}
    profiles: ["migrate"]
    env_file: ../.env.production
    command: ["/app/app", "-migrate-only"]
    environment:
      <<: *runtime-env
      DB_USER: littlecafe_reporting
      DB_PASSWORD: ${REPORTING_DB_PASSWORD:?REPORTING_DB_PASSWORD is required}
      DB_NAME: littlecafe_reporting
      DB_MIGRATE_ON_START: "true"
    depends_on:
      postgres: {condition: service_healthy}

  reporting:
    <<: *runtime
    image: ${REPORTING_IMAGE:?REPORTING_IMAGE is required}
    environment:
      <<: *runtime-env
      DB_USER: littlecafe_reporting
      DB_PASSWORD: ${REPORTING_DB_PASSWORD:?REPORTING_DB_PASSWORD is required}
      DB_NAME: littlecafe_reporting

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required}
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN is required}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-20m}
      NGINX_ENVSUBST_FILTER: ^(API_DOMAIN|WEB_ORIGIN|NGINX_CLIENT_MAX_BODY_SIZE)
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/prod.conf:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_DIR:-/opt/littlecafe/secrets/tls}:/etc/nginx/tls:ro
    depends_on:
      - identity
      - order
      - activity
      - wallet
      - ai
      - notification
      - reporting

volumes:
  postgres-data:
  rabbitmq-data:
