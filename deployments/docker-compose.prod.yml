name: littlecafe-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-security: &security
  - no-new-privileges:true

x-runtime: &runtime
  restart: unless-stopped
  # Run as the VPS deploy user so deploy-owned secrets (700 dirs, 600 keys)
  # are readable without making them world-readable.
  user: "${APP_UID:-1000}:${APP_GID:-1000}"
  env_file: ../.env.production
  environment: &runtime-env
    CONFIG_BASE: configs/base.yaml
    DB_HOST: postgres
    DB_MIGRATE_ON_START: "false"
    REDIS_HOST: redis
    RABBITMQ_HOST: rabbitmq
    JWT_PUBLIC_KEY: /run/littlecafe/jwt/jwt-public.pem
    JWT_PRIVATE_KEY: ""
    TZ: Asia/Ho_Chi_Minh
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    rabbitmq: {condition: service_healthy}
  mem_limit: 128m
  stop_grace_period: 30s
  security_opt: *security
  logging: *logging

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    mem_limit: 512m
    shm_size: 128m
    env_file: ../.env.production
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      POSTGRES_DB: postgres
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 20
    security_opt: *security
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 96m
    env_file: ../.env.production
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      TZ: Asia/Ho_Chi_Minh
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
    security_opt: *security
    logging: *logging

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    mem_limit: 384m
    env_file: ../.env.production
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      TZ: Asia/Ho_Chi_Minh
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 20
    security_opt: *security
    logging: *logging

  db-init:
    image: pgvector/pgvector:pg17
    profiles: ["init"]
    restart: "no"
    mem_limit: 64m
    env_file: ../.env.production
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER is required}
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      PGDATABASE: postgres
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./scripts/init-db.sh:/init-db.sh:ro
    entrypoint: ["/bin/sh", "/init-db.sh"]
    depends_on:
      postgres: {condition: service_healthy}
    security_opt: *security
    logging: *logging

  migrate-identity:
    image: ${IDENTITY_IMAGE:?IDENTITY_IMAGE is required}
    profiles: ["migrate"]
    restart: "no"
    mem_limit: 128m
    env_file: ../.env.production
    command: ["-migrate-only"]
    environment:
      <<: *runtime-env
      DB_USER: littlecafe_identity
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD is required}
      DB_NAME: littlecafe_identity
      DB_MIGRATE_ON_START: "true"
      JWT_PRIVATE_KEY: /run/littlecafe/jwt/jwt-private.pem
    depends_on:
      postgres: {condition: service_healthy}
    security_opt: *security
    logging: *logging

  identity:
    <<: *runtime
    image: ${IDENTITY_IMAGE:?IDENTITY_IMAGE is required}
    environment:
      <<: *runtime-env
      DB_USER: littlecafe_identity
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD is required}
      DB_NAME: littlecafe_identity
      GRPC_TLS_CA_FILE: /run/littlecafe/certs/ca.crt
      GRPC_TLS_CERT_FILE: /run/littlecafe/certs/identity.crt
      GRPC_TLS_KEY_FILE: /run/littlecafe/certs/identity.key
      JWT_PRIVATE_KEY: /run/littlecafe/jwt/jwt-private.pem
    volumes:
      - ${CERTS_DIR:-/opt/littlecafe-secrets/certs}:/run/littlecafe/certs:ro
      - ${JWT_DIR:-/opt/littlecafe-secrets/jwt}:/run/littlecafe/jwt:ro

  migrate-order:
    image: ${ORDER_IMAGE:?ORDER_IMAGE is required}
    profiles: ["migrate"]
    restart: "no"
    mem_limit: 128m
    env_file: ../.env.production
    command: ["-migrate-only"]
    environment:
      <<: *runtime-env
      DB_USER: littlecafe_order
      DB_PASSWORD: ${ORDER_DB_PASSWORD:?ORDER_DB_PASSWORD is required}
      DB_NAME: littlecafe_order
      DB_MIGRATE_ON_START: "true"
    depends_on:
      postgres: {condition: service_healthy}
    security_opt: *security
    logging: *logging

  order:
    <<: *runtime
    image: ${ORDER_IMAGE:?ORDER_IMAGE is required}
    environment:
      <<: *runtime-env
      DB_USER: littlecafe_order
      DB_PASSWORD: ${ORDER_DB_PASSWORD:?ORDER_DB_PASSWORD is required}
      DB_NAME: littlecafe_order
      GRPC_TLS_CA_FILE: /run/littlecafe/certs/ca.crt
      GRPC_TLS_CERT_FILE: /run/littlecafe/certs/order.crt
      GRPC_TLS_KEY_FILE: /run/littlecafe/certs/order.key
    volumes:
      - ${CERTS_DIR:-/opt/littlecafe-secrets/certs}:/run/littlecafe/certs:ro
      - ${JWT_DIR:-/opt/littlecafe-secrets/jwt}/jwt-public.pem:/run/littlecafe/jwt/jwt-public.pem:ro

  migrate-activity:
    image: ${ACTIVITY_IMAGE:?ACTIVITY_IMAGE is required}
    profiles: ["migrate"]
    restart: "no"
    mem_limit: 128m
    env_file: ../.env.production
    command: ["-migrate-only"]
    environment:
      <<: *runtime-env
      DB_USER: littlecafe_activity
      DB_PASSWORD: ${ACTIVITY_DB_PASSWORD:?ACTIVITY_DB_PASSWORD is required}
      DB_NAME: littlecafe_activity
      DB_MIGRATE_ON_START: "true"
    depends_on:
      postgres: {condition: service_healthy}
    security_opt: *security
    logging: *logging

  activity:
    <<: *runtime
    image: ${ACTIVITY_IMAGE:?ACTIVITY_IMAGE is required}
    environment:
      <<: *runtime-env
      DB_USER: littlecafe_activity
      DB_PASSWORD: ${ACTIVITY_DB_PASSWORD:?ACTIVITY_DB_PASSWORD is required}
      DB_NAME: littlecafe_activity
      GRPC_TLS_CA_FILE: /run/littlecafe/certs/ca.crt
      GRPC_TLS_CERT_FILE: /run/littlecafe/certs/activity.crt
      GRPC_TLS_KEY_FILE: /run/littlecafe/certs/activity.key
    volumes:
      - ${CERTS_DIR:-/opt/littlecafe-secrets/certs}:/run/littlecafe/certs:ro
      - ${JWT_DIR:-/opt/littlecafe-secrets/jwt}/jwt-public.pem:/run/littlecafe/jwt/jwt-public.pem:ro

  migrate-wallet:
    image: ${WALLET_IMAGE:?WALLET_IMAGE is required}
    profiles: ["migrate"]
    restart: "no"
    mem_limit: 128m
    env_file: ../.env.production
    command: ["-migrate-only"]
    environment:
      <<: *runtime-env
      DB_USER: littlecafe_wallet
      DB_PASSWORD: ${WALLET_DB_PASSWORD:?WALLET_DB_PASSWORD is required}
      DB_NAME: littlecafe_wallet
      DB_MIGRATE_ON_START: "true"
    depends_on:
      postgres: {condition: service_healthy}
    security_opt: *security
    logging: *logging

  wallet:
    <<: *runtime
    image: ${WALLET_IMAGE:?WALLET_IMAGE is required}
    environment:
      <<: *runtime-env
      DB_USER: littlecafe_wallet
      DB_PASSWORD: ${WALLET_DB_PASSWORD:?WALLET_DB_PASSWORD is required}
      DB_NAME: littlecafe_wallet
      GRPC_TLS_CA_FILE: /run/littlecafe/certs/ca.crt
      GRPC_TLS_CERT_FILE: /run/littlecafe/certs/wallet.crt
      GRPC_TLS_KEY_FILE: /run/littlecafe/certs/wallet.key
    volumes:
      - ${CERTS_DIR:-/opt/littlecafe-secrets/certs}:/run/littlecafe/certs:ro
      - ${JWT_DIR:-/opt/littlecafe-secrets/jwt}/jwt-public.pem:/run/littlecafe/jwt/jwt-public.pem:ro

  migrate-ai:
    image: ${AI_IMAGE:?AI_IMAGE is required}
    profiles: ["migrate"]
    restart: "no"
    mem_limit: 128m
    env_file: ../.env.production
    command: ["-migrate-only"]
    environment:
      <<: *runtime-env
      DB_USER: littlecafe_ai
      DB_PASSWORD: ${AI_DB_PASSWORD:?AI_DB_PASSWORD is required}
      DB_NAME: littlecafe_ai
      DB_MIGRATE_ON_START: "true"
    depends_on:
      postgres: {condition: service_healthy}
    security_opt: *security
    logging: *logging

  ai:
    <<: *runtime
    image: ${AI_IMAGE:?AI_IMAGE is required}
    environment:
      <<: *runtime-env
      DB_USER: littlecafe_ai
      DB_PASSWORD: ${AI_DB_PASSWORD:?AI_DB_PASSWORD is required}
      DB_NAME: littlecafe_ai
    volumes:
      - ${JWT_DIR:-/opt/littlecafe-secrets/jwt}/jwt-public.pem:/run/littlecafe/jwt/jwt-public.pem:ro

  migrate-notification:
    image: ${NOTIFICATION_IMAGE:?NOTIFICATION_IMAGE is required}
    profiles: ["migrate"]
    restart: "no"
    mem_limit: 128m
    env_file: ../.env.production
    command: ["-migrate-only"]
    environment:
      <<: *runtime-env
      DB_USER: littlecafe_notification
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?NOTIFICATION_DB_PASSWORD is required}
      DB_NAME: littlecafe_notification
      DB_MIGRATE_ON_START: "true"
    depends_on:
      postgres: {condition: service_healthy}
    security_opt: *security
    logging: *logging

  notification:
    <<: *runtime
    image: ${NOTIFICATION_IMAGE:?NOTIFICATION_IMAGE is required}
    environment:
      <<: *runtime-env
      DB_USER: littlecafe_notification
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?NOTIFICATION_DB_PASSWORD is required}
      DB_NAME: littlecafe_notification
    volumes:
      - ${JWT_DIR:-/opt/littlecafe-secrets/jwt}/jwt-public.pem:/run/littlecafe/jwt/jwt-public.pem:ro

  migrate-reporting:
    image: ${REPORTING_IMAGE:?REPORTING_IMAGE is required}
    profiles: ["migrate"]
    restart: "no"
    mem_limit: 128m
    env_file: ../.env.production
    command: ["-migrate-only"]
    environment:
      <<: *runtime-env
      DB_USER: littlecafe_reporting
      DB_PASSWORD: ${REPORTING_DB_PASSWORD:?REPORTING_DB_PASSWORD is required}
      DB_NAME: littlecafe_reporting
      DB_MIGRATE_ON_START: "true"
    depends_on:
      postgres: {condition: service_healthy}
    security_opt: *security
    logging: *logging

  reporting:
    <<: *runtime
    image: ${REPORTING_IMAGE:?REPORTING_IMAGE is required}
    environment:
      <<: *runtime-env
      DB_USER: littlecafe_reporting
      DB_PASSWORD: ${REPORTING_DB_PASSWORD:?REPORTING_DB_PASSWORD is required}
      DB_NAME: littlecafe_reporting
    volumes:
      - ${JWT_DIR:-/opt/littlecafe-secrets/jwt}/jwt-public.pem:/run/littlecafe/jwt/jwt-public.pem:ro

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    mem_limit: 48m
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      NGINX_ENVSUBST_FILTER: ^(API_DOMAIN|HTTPS_PORT)
      TZ: Asia/Ho_Chi_Minh
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    volumes:
      - ./nginx/prod.conf:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_DIR:-/opt/littlecafe-tls}:/etc/nginx/tls:ro
    depends_on:
      - identity
      - order
      - activity
      - wallet
      - ai
      - notification
      - reporting
    security_opt: *security
    logging: *logging

volumes:
  postgres-data:
  rabbitmq-data:
