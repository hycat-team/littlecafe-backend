name: littlecafe-backend-dev

x-service-common: &service-common
    build:
        context: ..
    restart: unless-stopped
    profiles: ["full"]
    env_file: ../.env
    environment: &service-env
        CONFIG_BASE: configs/base.yaml
        DB_HOST: postgres
        DB_MIGRATE_ON_START: "true"
        REDIS_HOST: redis
        RABBITMQ_HOST: rabbitmq
        TZ: Asia/Ho_Chi_Minh
    depends_on:
        postgres: {condition: service_healthy}
        redis: {condition: service_healthy}
        rabbitmq: {condition: service_healthy}

services:
    postgres:
        image: pgvector/pgvector:pg17
        profiles: ["infra", "full"]
        restart: unless-stopped
        env_file: ../.env
        environment:
            POSTGRES_USER: ${POSTGRES_ADMIN_USER}
            POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
            POSTGRES_DB: postgres
            TZ: Asia/Ho_Chi_Minh
        ports: ["5432:5432"]
        volumes:
            - postgres-data:/var/lib/postgresql/data
            - ../database/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d postgres"]
            interval: 5s
            timeout: 3s
            retries: 20

    redis:
        image: redis:7-alpine
        profiles: ["infra", "full"]
        restart: unless-stopped
        env_file: ../.env
        environment:
            TZ: Asia/Ho_Chi_Minh
        ports: ["6379:6379"]
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 20

    rabbitmq:
        image: rabbitmq:3-management-alpine
        profiles: ["infra", "full"]
        restart: unless-stopped
        env_file: ../.env
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
            TZ: Asia/Ho_Chi_Minh
        ports:
            - "5672:5672"
            - "15672:15672"
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 10s
            timeout: 5s
            retries: 20

    commerce:
        <<: *service-common
        build:
            context: ..
            dockerfile: services/commerce/Dockerfile
        environment:
            <<: *service-env
            DB_USER: littlecafe_commerce
            DB_PASSWORD: ${COMMERCE_DB_PASSWORD}
            DB_NAME: littlecafe_commerce
        ports:
            - "8101:8080"
            - "9101:9090"
        volumes:
            - ${CERTS_DIR}:/run/littlecafe/certs:ro

    experience:
        <<: *service-common
        build:
            context: ..
            dockerfile: services/experience/Dockerfile
        environment:
            <<: *service-env
            DB_USER: littlecafe_experience
            DB_PASSWORD: ${EXPERIENCE_DB_PASSWORD}
            DB_NAME: littlecafe_experience
        ports:
            - "8102:8080"
            - "9102:9090"
        volumes:
            - ${CERTS_DIR}:/run/littlecafe/certs:ro

    ai:
        <<: *service-common
        build:
            context: ..
            dockerfile: services/ai/Dockerfile
        environment:
            <<: *service-env
            DB_USER: littlecafe_ai
            DB_PASSWORD: ${AI_DB_PASSWORD}
            DB_NAME: littlecafe_ai
        ports:
            - "8103:8080"
            - "9103:9090"
        volumes:
            - ${CERTS_DIR}:/run/littlecafe/certs:ro

    platform:
        <<: *service-common
        build:
            context: ..
            dockerfile: services/platform/Dockerfile
        environment:
            <<: *service-env
            DB_USER: littlecafe_platform
            DB_PASSWORD: ${PLATFORM_DB_PASSWORD}
            DB_NAME: littlecafe_platform
        ports:
            - "8104:8080"
            - "9104:9090"
        volumes:
            - ${CERTS_DIR}:/run/littlecafe/certs:ro

    nginx:
        image: nginx:alpine
        profiles: ["full"]
        restart: unless-stopped
        ports: ["8080:80"]
        volumes:
            - ./nginx/local.conf:/etc/nginx/templates/default.conf.template:ro
        depends_on:
            - commerce
            - experience
            - ai
            - platform

    otel-collector:
        image: otel/opentelemetry-collector-contrib:0.138.0
        profiles: ["observability"]
        command: ["--config=/etc/otelcol/config.yaml"]
        volumes:
            - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
        ports: ["4317:4317", "4318:4318"]

    prometheus:
        image: prom/prometheus:v3.7.1
        profiles: ["observability"]
        volumes:
            - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
        ports: ["9090:9090"]

volumes:
    postgres-data:
